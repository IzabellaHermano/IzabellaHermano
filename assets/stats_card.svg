<svg width="420" height="165" viewBox="0 0 420 165" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rankbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e8c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ad1457;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="420" height="165" rx="12" fill="#1a0a10"/>
  <rect width="420" height="165" rx="12" fill="none" stroke="#e91e8c" stroke-width="1"/>

  <!-- Title -->
  <text x="20" y="30" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#e91e8c" letter-spacing="1">GitHub Stats</text>
  <line x1="20" y1="38" x2="400" y2="38" stroke="#e91e8c" stroke-width="0.5" opacity="0.3"/>

  <!-- Rank circle -->
  <circle cx="355" cy="90" r="42" fill="url(#rankbg)" stroke="#e91e8c" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <text x="355" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#ffffff">B+</text>
  <text x="355" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fce4ec" letter-spacing="1">RANK</text>

  <!-- Stats rows -->
  <!-- Total Stars -->
  <text x="22" y="62" font-family="Arial, sans-serif" font-size="12" fill="#fce4ec" opacity="0.8">⭐  Total Stars</text>
  <text x="270" y="62" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>

  <!-- Total Commits -->
  <text x="22" y="84" font-family="Arial, sans-serif" font-size="12" fill="#fce4ec" opacity="0.8">📦  Total Commits (2024)</text>
  <text x="270" y="84" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">394</text>

  <!-- PRs -->
  <text x="22" y="106" font-family="Arial, sans-serif" font-size="12" fill="#fce4ec" opacity="0.8">🔀  Total PRs</text>
  <text x="270" y="106" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>

  <!-- Issues -->
  <text x="22" y="128" font-family="Arial, sans-serif" font-size="12" fill="#fce4ec" opacity="0.8">🐛  Total Issues</text>
  <text x="270" y="128" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">0</text>

  <!-- Repos -->
  <text x="22" y="150" font-family="Arial, sans-serif" font-size="12" fill="#fce4ec" opacity="0.8">📁  Repositórios Públicos</text>
  <text x="270" y="150" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">29</text>
</svg>
