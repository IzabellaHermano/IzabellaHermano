<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d63384"/>
      <stop offset="50%" style="stop-color:#e91e8c"/>
      <stop offset="100%" style="stop-color:#ad1457"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c2185b;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#f06292;stop-opacity:0.3"/>
