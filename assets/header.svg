  <!-- Decorative circles -->
  <circle cx="820" cy="40" r="120" fill="none" stroke="white" stroke-width="0.8" opacity="0.1"/>
  <circle cx="820" cy="40" r="80" fill="none" stroke="white" stroke-width="0.8" opacity="0.08"/>
  <circle cx="80" cy="190" r="90" fill="none" stroke="white" stroke-width="0.8" opacity="0.08"/>
  <circle cx="820" cy="40" r="40" fill="white" opacity="0.04"/>

  <!-- Wave bottom shape -->
  <path d="M0,160 Q225,220 450,180 Q675,140 900,190 L900,220 L0,220 Z" fill="#1a0a10" opacity="0.5"/>
  <path d="M0,175 Q225,210 450,195 Q675,175 900,200 L900,220 L0,220 Z" fill="#1a0a10"/>

  <!-- Name -->
  <text x="450" y="95" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="white" letter-spacing="2">Izabella Hermano</text>

